[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairlend-privacy"
version = "0.1.0"
description = "Privacy-preserving protected-attribute fairness auditing prototype for loan processing (reference implementation of the FairLend manuscript)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahender Kumar" }]
keywords = [
    "fairness",
    "privacy",
    "homomorphic-encryption",
    "fairness-auditing",
    "credit-scoring",
    "differential-privacy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "tenseal>=0.3.14",
    "cryptography>=41.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mahend72/FairLend-Privacy"
Repository = "https://github.com/mahend72/FairLend-Privacy"

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.0", "twine>=5.0"]
evaluation = ["pandas>=2.0", "scikit-learn>=1.3", "pyarrow>=14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
