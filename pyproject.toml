[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairlend"
version = "0.1.0.dev0"
description = "Privacy-preserving protected-attribute fairness auditing prototype for loan processing (reference implementation of the FairLend manuscript)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tenseal>=0.3.14",
    "cryptography>=41.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
evaluation = ["pandas>=2.0", "scikit-learn>=1.3", "pyarrow>=14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
