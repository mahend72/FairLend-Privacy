name: Tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Small, deliberately conservative matrix: TenSEAL wheel
        # availability was verified for both of these versions before
        # adding them here (see docs/FINAL_REPRODUCIBLE_RESULTS.md /
        # session notes) -- this is not a broad version sweep, since
        # TenSEAL does not publish wheels for every Python release.
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package (dev + evaluation extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evaluation]"

      - name: Verify the package imports
        run: python -c "import fairlend"

      - name: Run test suite
        # No raw or processed LendingClub data is required: every test
        # exercises tests/fixtures/lendingclub_sample.csv (a small,
        # tracked, synthetic-scale fixture) or hand-built in-memory data
        # only. A couple of tests skip by design when an OPTIONAL,
        # gitignored fixture-validation intermediate has not been
        # separately generated in this checkout -- that is expected, not
        # a failure.
        run: pytest -v

  build:
    name: Build distribution and validate metadata
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package (dev extras) and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata (twine check)
        run: python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
