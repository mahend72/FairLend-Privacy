name: Release

# Tag-triggered only. Does NOT publish to PyPI -- see docs/PUBLISHING.md
# for the (not-yet-enabled) future PyPI publishing plan. This workflow
# only builds the distribution, validates it, and attaches the
# resulting wheel + sdist to a GitHub Release for the pushed tag.
"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, validate, and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package (dev + evaluation extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evaluation]"

      - name: Verify the package imports
        run: python -c "import fairlend"

      - name: Run test suite
        run: pytest -v

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata (twine check)
        run: python -m twine check dist/*

      - name: Create GitHub Release and attach distributions
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
        # Not published to PyPI here or anywhere else in this workflow.
