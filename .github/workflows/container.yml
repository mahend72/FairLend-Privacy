name: Container

# Tag-triggered only -- this workflow builds and publishes the FairLend
# container image to GitHub Container Registry (GHCR) so it appears
# under the repository owner's GitHub Packages. It does NOT publish to
# PyPI (see release.yml / docs/PUBLISHING.md) and does NOT run on
# ordinary pushes to main.
"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata/tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # docker/metadata-action lower-cases the resulting image name
          # automatically, so ghcr.io/OWNER/REPO always normalizes
          # correctly regardless of the repository's stored casing.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build image (smoke-test before push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test built image
        # A single import check, not the full pytest suite -- the test
        # suite already ran in tests.yml for this commit; this only
        # confirms the packaged image itself is usable.
        run: |
          docker run --rm "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" \
            python -c "import fairlend; print('FairLend-Privacy ready')"

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
